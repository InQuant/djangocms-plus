<div class="icon-field-widget" data-widget-id="{{ widget.attrs.id }}">
  <!-- selected Icon -->
  <div class="highlight-selected-icon">
    <i class="selected-icon {{ widget.value }}"></i>
    <div class="selected-icon-name">{{ widget.value }}</div>
    <button type="button" class="btn btn-outline-secondary btn-sm mt-2" data-bs-toggle="modal" data-bs-target="#iconSelectModal-{{ widget.attrs.id }}">
      Icon
    </button>
  </div>

  <!-- Hidden Field -->
  <input class="hidden-icon-field" type="hidden" name="{{ widget.name }}" value="{{ widget.value }}" id="{{ widget.attrs.id }}">

  <!-- Modal (eindeutige ID!) -->
  <div class="modal fade" id="iconSelectModal-{{ widget.attrs.id }}" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Icon</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" class="form-control icon-search mb-3" placeholder="Icon filtern...">
          <div class="d-flex flex-wrap gap-2 icon-list">
            {% for icon in widget.icons %}
              <button class="btn btn-light icon-select-btn" type="button"
                      data-icon-name="{{ icon.name }}"
                      data-icon-class="{{ icon.font_class_name }}">
                <i class="{{ icon.font_class_name }}"></i>
              </button>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
