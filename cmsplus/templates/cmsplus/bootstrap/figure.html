{% load cms_tags %}
<figure "figure">
  {% for child in instance.child_plugin_instances %}
    {% render_plugin child %}
  {% endfor %}
  <figcaption {{ instance.get_attributes }}>{{ instance.caption }}</figcaption>
</figure>

{% if instance.glossary.extra_css %}
  {% include "cmsplus/includes/_extra_css.html" %}
{% endif %}
