{% load l10n cms_tags cmsplus %}
{% localize off %}{% spaceless %}

{% if link %}<a href="{{ link }}" {% get_attributes instance.link_attributes %}>{% endif %}

<img id="svgimg-{{ instance.id}}" {{ instance.get_attributes }}
  {% if not instance.attributes.alt and instance.image.default_alt_text %} alt="{{ instance.image.default_alt_text }}"{% endif %}
	src="{{ instance.image.url }}"/>

{% if link %}
  </a>
{% endif %}

{% endspaceless %}{% endlocalize %}

{% if instance.glossary.extra_css %}
  {% include "cmsplus/includes/_extra_css.html" %}
{% endif %}
