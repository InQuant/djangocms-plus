{% load sekizai_tags thumbnail %}

{% with id=instance.id img=instance.image f=instance.image_filter imgwidths=imgwidths crop=crop upscale=instance.upscale %}

{% addtoblock 'css' %}
<style>

.container-image-{{ id }} {
{% if imgwidths %}
  {% thumbnail img imgwidths.0 crop=crop upscale=upscale as thumb %}
  background-image: {% if f %}{{ f }},{% endif %} url({{ thumb.url }});
{% else %}
  background-image: {% if f %}{{ f }},{% endif %} url({{ img.url }});
{% endif %}
  background-size: cover;
  background-position: {{ image.positon }};
}

{% for k, size in imgwidths.items %}
  {% if k and k != 0 %}
    @media (min-width: {{ k }}px ) {
      .container-image-{{ id }} {
        {% thumbnail img size crop=crop upscale=upscale as thumb %}
        background-image: {% if f %}{{ f }},{% endif %} url({{ thumb.url }});
      }
    }
  {% endif %}
{% endfor %}
</style>
{% endaddtoblock %}

{% endwith %}
