{% load cms_tags %}

{% with is_first=forloop.first %}
<div {{ instance.get_attributes }}>

  <h2 class="accordion-header" id="heading-{{ instance.pk }}">
    <button
      class="accordion-button d-flex justify-content-between align-items-center{% if not is_first or not parent_instance.first_is_open %} collapsed{% endif %}"
      type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{{ instance.pk }}" aria-expanded="false"
      aria-controls="collapse-{{ instance.pk }}">
      <span>{{ heading }}</span>
      <i class="{{ parent_instance.icon }} ms-auto transition"></i>
    </button>
  </h2>

  <!-- body -->
  <div id="collapse-{{ instance.pk }}"
    class="accordion-collapse collapse{% if is_first and parent_instance.first_is_open %}show{% endif %}"
    aria-labelledby="heading-{{ instance.pk }}" data-bs-parent="#{{ instance.parent.id }}">
    <div class="accordion-body">
      {% for plugin in instance.child_plugin_instances %}
      {% with parentloop=forloop parent=instance %}{% render_plugin plugin %}{% endwith %}
      {% empty %}{{ instance.simple_content }}{% endfor %}
    </div>
  </div>
</div>
{% endwith %}
