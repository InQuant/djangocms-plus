{% load cms_tags %}
<div class="cmsplus-accordion-group">
  <div {{ instance.get_attributes }}>{{ heading }}</div>
  <div class="cmsplus-accordion-body">
    {% for child in instance.child_plugin_instances %}
      {% render_plugin child %}
    {% endfor %}
  </div>
</div>

{% if instance.glossary.extra_css %}
  {% include "cmsplus/includes/_extra_css.html" %}
{% endif %}
